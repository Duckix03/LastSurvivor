# Servidor online do Last Survivor (Cloudflare Workers + Durable Objects, plano grátis)
# Publicar: cd server && npx wrangler login && npx wrangler deploy
name = "lastsurvivor"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

# contas (nome único, senha, curtidas, selos). A chave de admin NÃO fica aqui: use
#   npx wrangler secret put ADMIN_KEY
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

# salas personalizadas (só amigos): uma por sala + a lista de salas abertas
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "ROOMDIR"
class_name = "RoomDir"

# o plano grátis só aceita Durable Objects com SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "Match"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Room", "RoomDir"]

# login com Google: o mesmo ID de cliente OAuth que está em LS.GOOGLE_CLIENT_ID (js/config.js). Vazio = desligado.
[vars]
GOOGLE_CLIENT_ID = ""

# região dos Durable Objects (partidas, salas, fila): "sam" = América do Sul. Outras: wnam enam weur eeur apac oc afr me. Vazio = sem dica.
LOC_HINT = "sam"
